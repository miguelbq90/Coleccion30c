# Temporal: hace capturas de las maquetas del menú de colecciones con los logos reales.
# Solo vive en la rama «maquetas»; no toca la app.
name: Maquetas (temporal)
on:
  push:
    branches: [maquetas]
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install "playwright==1.*" pillow imageio-ffmpeg
      - run: python maquetas/hacer2.py . maquetas/out
        env:
          CHROME: /usr/bin/google-chrome
          ART: '154'
          MODOS: CAND,SH,SA
      - name: Guardar las capturas en la rama
        run: |
          git config user.name "robot-maquetas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maquetas/out
          git commit -m "Capturas de las maquetas" || exit 0
          git push
